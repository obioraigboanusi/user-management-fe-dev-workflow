pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint {staged_files}

    - name: prettier
      glob: '*.{js,jsx,ts,tsx,json,css,md,yml,yaml}'
      run: npx prettier --check {staged_files}
